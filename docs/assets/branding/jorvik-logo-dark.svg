<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" fill="none">
  <!-- Minimalist Norse carved wordmark (dark mode): J O R V I K -->
  <g stroke="#4db8ad" stroke-width="2" stroke-linecap="round">
    <line x1="68" y1="18" x2="256" y2="18"/>
    <line x1="304" y1="18" x2="492" y2="18"/>
    <line x1="68" y1="102" x2="256" y2="102"/>
    <line x1="304" y1="102" x2="492" y2="102"/>
  </g>
  <!-- Center & corner Norse lozenge knots -->
  <g fill="#ffc857">
    <polygon points="280,11 287,18 280,25 273,18"/>
    <polygon points="280,95 287,102 280,109 273,102"/>
    <polygon points="52,60 58,54 64,60 58,66"/>
    <polygon points="496,60 502,54 508,60 502,66"/>
  </g>

  <!-- Centered chiseled runic/Norse letterforms: J O R V I K -->
  <g transform="translate(16, 0)">
    <g stroke="#eef4f5" stroke-width="6.5" stroke-linecap="butt" stroke-linejoin="miter" fill="none">
      <!-- J -->
      <path d="M95 34 H121 M112 34 V74 L98 86 L84 74"/>
      <!-- O: Norse runic diamond -->
      <polygon points="168,33 192,60 168,87 144,60"/>
      <!-- R: angular Raido-rune R -->
      <path d="M222 89 V34 H244 L258 47 L244 60 H222 M239 60 L261 88"/>
      <!-- V -->
      <path d="M286 32 L308 86 L330 32"/>
      <!-- I -->
      <path d="M355 34 H377 M366 34 V86 M355 86 H377"/>
      <!-- K -->
      <path d="M406 31 V89 M442 33 L409 60 L444 87"/>
    </g>

    <!-- Inner gold diamond core inside the runic O -->
    <polygon points="168,52 175,60 168,68 161,60" fill="#ffc857"/>
  </g>
</svg>
