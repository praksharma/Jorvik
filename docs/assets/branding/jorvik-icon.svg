<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="jv-bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d353d"/>
      <stop offset="55%" stop-color="#145860"/>
      <stop offset="100%" stop-color="#0e3c42"/>
    </linearGradient>
    <linearGradient id="jv-domain" x1="26" y1="24" x2="102" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#53aeb8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1f7a84" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="jv-rim" x1="20" y1="14" x2="108" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64d8cb"/>
      <stop offset="100%" stop-color="#2a949e"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded hexagonal CAD badge -->
  <path d="M64 7 L111 34 C114.5 36 116.5 39.7 116.5 43.8 V84.2 C116.5 88.3 114.5 92 111 94 L64 121 L17 94 C13.5 92 11.5 88.3 11.5 84.2 V43.8 C11.5 39.7 13.5 36 17 34 Z"
        fill="url(#jv-bg)" stroke="url(#jv-rim)" stroke-width="3.2"/>

  <!-- Subtle CAD parametric isolines inside the annulus domain -->
  <circle cx="64" cy="64" r="40" fill="url(#jv-domain)" stroke="#7ce5d9" stroke-width="2" stroke-opacity="0.75"/>
  <circle cx="64" cy="64" r="30.5" stroke="#64d8cb" stroke-width="1" stroke-dasharray="3.5 3.5" stroke-opacity="0.45"/>
  <path d="M64 24 V44 M64 84 V104 M24 64 H44 M84 64 H104 M35.7 35.7 L49.9 49.9 M78.1 78.1 L92.3 92.3 M92.3 35.7 L78.1 49.9 M49.9 78.1 L35.7 92.3"
        stroke="#64d8cb" stroke-width="1" stroke-opacity="0.32" stroke-linecap="round"/>

  <!-- Central open CAD cavity (inner boundary region) with warm gold highlight -->
  <circle cx="64" cy="64" r="20" fill="#13252b" stroke="#ffc857" stroke-width="2.6"/>

  <!-- Outward boundary co-normal vectors on outer & inner boundaries -->
  <g stroke="#ffc857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer top normal -->
    <path d="M64 24 V14 M60.5 17.5 L64 14 L67.5 17.5"/>
    <!-- Outer right normal -->
    <path d="M104 64 H114 M110.5 60.5 L114 64 L110.5 67.5"/>
    <!-- Outer bottom-left normal -->
    <path d="M35.7 92.3 L28.6 99.4 M28.6 94.2 L28.6 99.4 L33.8 99.4"/>
    <!-- Inner hole inward-pointing (outward from domain) co-normals -->
    <path d="M64 44 V51.5 M61.5 49 L64 51.5 L66.5 49"/>
    <path d="M84 64 H76.5 M79 61.5 L76.5 64 L79 66.5"/>
    <path d="M49.9 78.1 L55.2 72.8 M52 72.8 H55.2 V76"/>
  </g>

  <!-- Interior low-discrepancy collocation sample points (cyan/teal) -->
  <g fill="#7ef0e3" stroke="#0f282e" stroke-width="1.2">
    <circle cx="64" cy="33" r="3.1"/>
    <circle cx="80" cy="37" r="2.9"/>
    <circle cx="91" cy="51" r="3.1"/>
    <circle cx="95" cy="64" r="2.9"/>
    <circle cx="89" cy="79" r="3.1"/>
    <circle cx="77" cy="91" r="2.9"/>
    <circle cx="64" cy="95" r="3.1"/>
    <circle cx="48" cy="90" r="2.9"/>
    <circle cx="37" cy="78" r="3.1"/>
    <circle cx="33" cy="64" r="2.9"/>
    <circle cx="38" cy="49" r="3.1"/>
    <circle cx="49" cy="37" r="2.9"/>
    <!-- Dense boundary-layer ring near the inner wall -->
    <circle cx="55" cy="42" r="2.6" fill="#b4fff6"/>
    <circle cx="73" cy="42" r="2.6" fill="#b4fff6"/>
    <circle cx="86" cy="55" r="2.6" fill="#b4fff6"/>
    <circle cx="86" cy="73" r="2.6" fill="#b4fff6"/>
    <circle cx="73" cy="86" r="2.6" fill="#b4fff6"/>
    <circle cx="55" cy="86" r="2.6" fill="#b4fff6"/>
    <circle cx="42" cy="73" r="2.6" fill="#b4fff6"/>
    <circle cx="42" cy="55" r="2.6" fill="#b4fff6"/>
  </g>

  <!-- Boundary region collocation sample points (gold) -->
  <g fill="#ffc857" stroke="#13252b" stroke-width="1.3">
    <!-- Inner circle boundary samples -->
    <circle cx="64" cy="44" r="3.4"/>
    <circle cx="78.1" cy="49.9" r="3.2"/>
    <circle cx="84" cy="64" r="3.4"/>
    <circle cx="78.1" cy="78.1" r="3.2"/>
    <circle cx="64" cy="84" r="3.4"/>
    <circle cx="49.9" cy="78.1" r="3.2"/>
    <circle cx="44" cy="64" r="3.4"/>
    <circle cx="49.9" cy="49.9" r="3.2"/>
    <!-- Outer circle boundary samples -->
    <circle cx="64" cy="24" r="3.4"/>
    <circle cx="92.3" cy="35.7" r="3.2"/>
    <circle cx="104" cy="64" r="3.4"/>
    <circle cx="92.3" cy="92.3" r="3.2"/>
    <circle cx="64" cy="104" r="3.4"/>
    <circle cx="35.7" cy="92.3" r="3.4"/>
    <circle cx="24" cy="64" r="3.2"/>
    <circle cx="35.7" cy="35.7" r="3.2"/>
  </g>
</svg>
